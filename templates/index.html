<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat Client</title>
    <style>
        body { background-color: #1a1a1a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .chat-container { width: 100%; max-width: 400px; height: 100dvh; max-height: 600px; background-color: #242424; border-radius: 15px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        #chat-display { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid #333; }
        .message { background-color: #333; padding: 10px; border-radius: 10px; font-size: 14px; line-height: 1.4; word-wrap: break-word; }
        .input-area { padding: 15px; display: flex; gap: 10px; background-color: #2b2b2b; }
        input { flex: 1; background-color: #333; border: none; padding: 10px; color: white; border-radius: 5px; outline: none; }
        button { background-color: #3b82f6; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2563eb; }
    </style>
</head>
<body>

<div class="chat-container">
    <div id="chat-display"></div>
    <div class="input-area">
        <input type="text" id="msg-input" placeholder="Type message...">
        <button onclick="sendMessage()">Send</button>
    </div>
</div>

<script>
    let nickname = "";

    async function startChat() {
        nickname = prompt("Enter nickname:") || "Guest";

        try {
            await fetch('/join', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ nickname: nickname })
            });
        } catch (error) {
            console.error("Error joining:", error);
        }

        const eventSource = new EventSource('/stream');

        eventSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            const display = document.getElementById('chat-display');

            display.innerHTML = '';

            data.messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = 'message';

                if (msg.includes(" | ")) {
                    div.textContent = msg.split(" | ")[1];
                } else {
                    div.textContent = msg;
                }
                display.appendChild(div);
            });

            display.scrollTop = display.scrollHeight;
        };

        eventSource.onerror = function(error) {
            console.error("SSE Error:", error);
        };
    }

    async function sendMessage() {
        const input = document.getElementById('msg-input');
        const text = input.value.trim();
        if (!text) return;

        try {
            await fetch('/send_message', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: `${nickname}: ${text}` })
            });
            input.value = '';
        } catch (error) {
            console.error("Error sending message:", error);
        }
    }

    document.getElementById('msg-input').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    window.onload = startChat;
</script>

</body>
</html>
